name: Build and publish blog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compute Pages address
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER_LOWER="${OWNER,,}"
          echo "SITE_URL=https://${OWNER_LOWER}.github.io" >> "$GITHUB_ENV"
          if [[ "${REPO,,}" == "${OWNER_LOWER}.github.io" ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${REPO}/" >> "$GITHUB_ENV"
          fi
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-build.mjs
      - name: Check publication readiness
        id: readiness
        shell: bash
        run: |
          if node scripts/preflight-publish.mjs; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Build completed. Publication is waiting for identity details and content confirmation.'
          fi
      - uses: actions/configure-pages@v5
        if: steps.readiness.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.readiness.outputs.ready == 'true'
        with:
          path: dist
  deploy:
    if: needs.build.outputs.ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4